<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MEKIKI | 食材の目利き・保存方法</title>

    <!-- PWA Settings for iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEKIKI">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- SEO & Icons -->
    <meta name="description" content="買い物中に瞬時に食材の美味しい選び方と保存方法を確認できるアプリ">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1 class="site-title">mekiki</h1>
        <p class="site-description">迷わず探せて、必要な情報がすぐ分かる食材ガイド</p>
        <label class="search-label" for="searchInput">食材を検索</label>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="食材名で検索..." autocomplete="off">
            <button type="button" id="clearSearch" class="search-clear" aria-label="検索文字をクリア" hidden>クリア</button>
        </div>
    </header>

    <div class="tabs" id="categoryTabs">
        <button class="tab active" data-category="all" aria-pressed="true"><span class="tab-check" aria-hidden="true">✓</span>すべて</button>
        <button class="tab" data-category="野菜" aria-pressed="false"><span class="tab-check" aria-hidden="true">✓</span>野菜</button>
        <button class="tab" data-category="果物" aria-pressed="false"><span class="tab-check" aria-hidden="true">✓</span>果物</button>
        <button class="tab" data-category="肉" aria-pressed="false"><span class="tab-check" aria-hidden="true">✓</span>肉</button>
        <button class="tab" data-category="魚" aria-pressed="false"><span class="tab-check" aria-hidden="true">✓</span>魚</button>
    </div>

    <main>
        <h2 class="food-list-title">食材一覧</h2>
        <p class="result-count" id="resultCount" role="status" aria-atomic="true"></p>
        <p class="empty-message" id="emptyMessage" hidden>該当する食材がありません。検索語やカテゴリーを変更してください。</p>
        <div class="grid" id="foodGrid">
            <!-- 食材カードが動的に挿入されます -->
        </div>
    </main>

    <!-- 詳細モーダル -->
    <dialog class="modal" id="detailModal" aria-labelledby="foodTitle">
            <div class="modal-header">
                <h2 class="modal-title" id="foodTitle">食材名</h2>
                <button type="button" class="close-btn" id="closeModal" aria-label="詳細画面を閉じる" autofocus>&times;</button>
            </div>

        <div class="modal-content">
            <div class="section">
                <h3 class="section-title"><i class="fa-solid fa-eye"></i> おいしい個体の見分け方</h3>
                <div id="selectInfo"></div>
            </div>

            <div class="section">
                <h3 class="section-title"><i class="fa-solid fa-box-archive"></i> 正しい保存方法</h3>
                <div id="storeInfo"></div>
            </div>

            <div class="source-links" id="sourceLinks">
                出典：<br>
            </div>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
